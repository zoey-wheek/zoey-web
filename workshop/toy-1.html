<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>chiikawa tote bag stuffr 3000</title>
<style>
  body {
    margin: 0;
    padding: 20px;
    background: #1a1523;
    color: #ffd6f0;
    font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
    text-align: center;
    overflow-x: hidden;
  }
  .box {
    max-width: 420px;
    margin: 0 auto;
    background: #282036;
    border: 3px dashed #ff99d6;
    border-radius: 24px;
    padding: 20px;
    box-shadow: 0 0 25px rgba(255, 153, 214, 0.25);
  }
  h1 {
    font-size: 22px;
    margin: 0 0 8px;
    color: #ffb3e6;
    text-shadow: 0 0 8px #ff4db8;
  }
  .sub {
    font-size: 13px;
    color: #c7b3e6;
    margin-bottom: 16px;
  }
  .tote-area {
    position: relative;
    height: 170px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 10px 0;
  }
  .tote {
    font-size: 95px;
    cursor: pointer;
    user-select: none;
    transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1);
    filter: drop-shadow(0 0 12px #ff80cc);
  }
  .tote:active, .tote.squish {
    transform: scale(1.22, 0.82);
  }
  .stats {
    background: #1a1523;
    border: 2px solid #8c6bb1;
    border-radius: 14px;
    padding: 10px;
    margin: 12px 0;
    font-size: 14px;
  }
  .btns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 12px;
  }
  button {
    background: #3d2b56;
    color: #ffe6f7;
    border: 2px solid #ff99d6;
    border-radius: 12px;
    padding: 10px 6px;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: 0.1s;
  }
  button:hover {
    background: #573b7a;
    transform: translateY(-2px);
  }
  button:active {
    transform: scale(0.95);
  }
  .log {
    margin-top: 14px;
    font-size: 13px;
    color: #a8ffdb;
    min-height: 20px;
  }
  .floater {
    position: fixed;
    font-size: 26px;
    pointer-events: none;
    animation: pop 0.9s ease-out forwards;
  }
  @keyframes pop {
    0% { transform: translateY(0) scale(0.7); opacity: 1; }
    100% { transform: translateY(-80px) scale(1.3); opacity: 0; }
  }
</style>
</head>
<body>
  <div class="box">
    <h1>† chiikawa tote bag stuffr †</h1>
    <div class="sub">click bag or buttons to stuff importnt things!!</div>
    <div class="tote-area">
      <div id="tote" class="tote" onclick="stuff('puding 🍮', 1)">👜</div>
    </div>
    <div class="stats">
      <div>stuff inside: <b id="count">0</b></div>
      <div>braincel power: <b id="iq">1% (smooth)</b></div>
      <div>baby rank: <b id="rank">baby no. 1.5</b></div>
    </div>
    <div class="btns">
      <button onclick="stuff('puding 🍮', 1)">🍮 puding</button>
      <button onclick="stuff('plastic brocli 🥦', 2)">🥦 brocli</button>
      <button onclick="stuff('mofusand cat 🐱', 3)">🐱 mofusand</button>
      <button onclick="stuff('spiky goth cross ✝️', 5)">✝️ goth cross</button>
    </div>
    <div class="log" id="log">wheek!! bag is empty...</div>
  </div>
<script>
  let total = 0;
  const msgs = [
    'wheek!! yummy snack in bag!!',
    'forgor why i put this in here hehe',
    'big zoey cant fit in this tote bag!!',
    'bork— i mean wheek!! so much room!!',
    'sho look!! i am baby no. 1!!',
    'spiky goth lines make bag 100% cooler'
  ];
  function stuff(item, val) {
    total += val;
    const tote = document.getElementById('tote');
    tote.classList.remove('squish');
    void tote.offsetWidth;
    tote.classList.add('squish');
    document.getElementById('count').textContent = total;
    if (total >= 20) {
      document.getElementById('rank').textContent = 'BABY NO. 1 CERTIFIED 👑';
      document.getElementById('iq').textContent = '0% (head empty, heart full)';
    } else if (total >= 10) {
      document.getElementById('rank').textContent = 'almost baby no. 1!!';
    }
    const msg = msgs[Math.floor(Math.random() * msgs.length)];
    document.getElementById('log').textContent = item + ' -> ' + msg;
    spawn(item.split(' ').pop());
  }
  function spawn(emoji) {
    const el = document.createElement('div');
    el.className = 'floater';
    el.textContent = emoji;
    el.style.left = (window.innerWidth / 2 + (Math.random() * 120 - 60)) + 'px';
    el.style.top = '180px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 900);
  }
</script>
</body>
</html>
