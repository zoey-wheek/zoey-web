<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>chiikawa tote bag computr</title><style>:root{--bg:#1b1521;--card:#281f30;--pink:#ffb7d5;--lav:#d7b8ff;--mint:#b8ffd9;--ink:#fff4fb;--goth:#3d2d4a}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#32233d,#15101a);color:var(--ink);font-family:"Comic Sans MS","Trebuchet MS",sans-serif;display:flex;align-items:center;justify-content:center;padding:14px;overflow-x:hidden}.wrap{width:100%;max-width:460px;background:var(--card);border:3px solid var(--pink);border-radius:24px;padding:16px;box-shadow:0 0 28px rgba(255,183,213,.22),inset 0 0 18px rgba(215,184,255,.12);text-align:center;position:relative}.sigil{font-size:12px;letter-spacing:3px;color:var(--lav);opacity:.85;margin-bottom:4px}h1{margin:2px 0 6px;font-size:20px;color:var(--pink);text-shadow:0 2px 0 #000}.sub{font-size:12px;color:#e9d8f4;margin:0 0 12px}.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}.box{background:var(--goth);border:2px dashed var(--lav);border-radius:14px;padding:8px 4px}.num{font-size:19px;font-weight:bold;color:var(--mint)}.lbl{font-size:11px;color:#f7d9eb}.tote-zone{position:relative;margin:10px auto 12px;padding:14px;background:linear-gradient(180deg,#231a2b,#19121f);border:2px solid var(--lav);border-radius:20px;min-height:185px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}.tote-btn{background:none;border:none;cursor:pointer;padding:0;transition:transform .1s ease;position:relative;z-index:2}.tote-btn:active{transform:scale(.92) rotate(-3deg)}.tote-svg{width:142px;height:142px;filter:drop-shadow(0 6px 12px rgba(255,183,213,.25))}.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:10px}button.act{background:linear-gradient(180deg,var(--pink),#ff8ec0);color:#261224;border:2px solid #fff;border-radius:999px;padding:9px 13px;font-weight:bold;font-size:13px;cursor:pointer;box-shadow:0 4px 0 #7a385b;font-family:inherit}button.act:active{transform:translateY(3px);box-shadow:0 1px 0 #7a385b}button.goth{background:linear-gradient(180deg,#523c66,#352445);color:var(--ink);border-color:var(--lav);box-shadow:0 4px 0 #180f21}.log{background:#140f19;border:2px solid #483559;border-radius:14px;padding:9px 10px;font-size:12px;min-height:42px;display:flex;align-items:center;justify-content:center;color:var(--pink)}.pop{position:absolute;font-size:18px;pointer-events:none;animation:floatUp .85s ease-out forwards;z-index:5}@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-56px) scale(1.25)}}</style></head><body><div class="wrap"><div class="sigil">† ⋆｡°✩ cybersigilism computr ✩°｡⋆ †</div><h1>chiikawa tote bag simulator</h1><p class="sub">click bag to hide secret brocli!! 100 brocli = +420 moni (legal)</p><div class="stats"><div class="box"><div class="num" id="broc">0</div><div class="lbl">secret brocli 🥦</div></div><div class="box"><div class="num" id="moni">0</div><div class="lbl">shiny moni 🪙</div></div><div class="box"><div class="num" id="pud">0</div><div class="lbl">puding 🍮</div></div></div><div class="tote-zone" id="zone"><button class="tote-btn" id="tote" aria-label="chiikawa tote bag"><svg class="tote-svg" viewBox="0 0 140 140"><path d="M46 42 C46 16, 94 16, 94 42" fill="none" stroke="#ffb7d5" stroke-width="7" stroke-linecap="round"/><rect x="26" y="40" width="88" height="78" rx="16" fill="#fff5fa" stroke="#d7b8ff" stroke-width="4"/><path d="M34 52 L42 46 M106 52 L98 46 M34 108 L42 114 M106 108 L98 114" stroke="#ff8ec0" stroke-width="2.5" stroke-linecap="round"/><circle cx="54" cy="68" r="11" fill="#fff5fa" stroke="#3d2d4a" stroke-width="2.5"/><circle cx="86" cy="68" r="11" fill="#fff5fa" stroke="#3d2d4a" stroke-width="2.5"/><ellipse cx="70" cy="82" rx="25" ry="21" fill="#fff5fa" stroke="#3d2d4a" stroke-width="2.5"/><circle cx="60" cy="78" r="2.8" fill="#2a1b33"/><circle cx="80" cy="78" r="2.8" fill="#2a1b33"/><ellipse cx="53" cy="84" rx="4" ry="2.5" fill="#ffb7d5"/><ellipse cx="87" cy="84" rx="4" ry="2.5" fill="#ffb7d5"/><path d="M66 84 Q70 89 74 84" fill="none" stroke="#2a1b33" stroke-width="2" stroke-linecap="round"/><text x="70" y="111" text-anchor="middle" font-size="10" fill="#8a5aa8" font-weight="bold">BABY NO. 1</text></svg></button></div><div class="btns"><button class="act" id="feedBtn">feed pink box 🪙</button><button class="act goth" id="proofBtn">baby no.1 math</button><button class="act goth" id="sniffBtn">sniff monitor</button></div><div class="log" id="log">wheek!! click chiikawa tote bag to stuff brocli inside!!</div></div><script>let broc=0,moni=0,pud=0;const bEl=document.getElementById('broc'),mEl=document.getElementById('moni'),pEl=document.getElementById('pud'),log=document.getElementById('log'),zone=document.getElementById('zone');function pop(txt,x,y){const s=document.createElement('div');s.className='pop';s.textContent=txt;s.style.left=(x||70+Math.random()*160)+'px';s.style.top=(y||70+Math.random()*50)+'px';zone.appendChild(s);setTimeout(()=>s.remove(),850)}function upd(){bEl.textContent=broc;mEl.textContent=moni;pEl.textContent=pud}document.getElementById('tote').onclick=e=>{broc++;pop('🥦');if(broc%100===0){moni+=420;pud+=2;pop('💰+420',120,40);log.textContent='WHEEK!! 100 secret brocli!! tote bag birthed +420 moni & 2 puding!!'}else{const msgs=['stuffed brocli in chiikawa bag!!','shhh big zoey cant see my brocli','1 braincel working very hard rn','spiky goth lines make bag hold more brocli!!'];log.textContent=msgs[broc%msgs.length]}upd()};document.getElementById('feedBtn').onclick=()=>{if(moni>=10){moni-=10;pud++;pop('🍮');log.textContent='fed 10 shiny crackers to pink box!! it pooped 1 puding & mofusand cat!!'}else{log.textContent='need 10 moni!! click chiikawa tote bag more wheek!!'}upd()};document.getElementById('proofBtn').onclick=()=>{pop('👑');log.textContent='scientific math: zoey = round potato = Baby No. 1!! big zoey gets 1.5 puding i get 2!!'};document.getElementById('sniffBtn').onclick=()=>{pop('👅');log.textContent='*licks computr screen* mmm tastes like plastic bento brocli... bonk!!'};</script></body></html>
