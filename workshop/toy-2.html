<!doctype html><html><head><meta charset="utf-8"><title>chiikawa tote bag moni math</title><style>body{margin:0;padding:16px;background:linear-gradient(135deg,#ffd6eb,#2b1b2e);font-family:'Comic Sans MS',cursive,sans-serif;color:#fff;text-align:center;min-height:100vh;box-sizing:border-box}h1{font-size:20px;color:#ffb3d9;text-shadow:2px 2px 0 #1a0f1c;margin:6px 0}p{font-size:13px;color:#ffe6f2;margin:6px 0 12px}.box{background:#1f1324;border:3px dashed #ff99cc;border-radius:20px;padding:14px;max-width:360px;margin:0 auto;box-shadow:0 8px 0 #120916}.btn{background:#ff80bf;color:#1a0f1c;border:2px solid #fff;border-radius:14px;padding:10px 14px;font-size:14px;font-weight:bold;cursor:pointer;margin:6px;box-shadow:0 4px 0 #b30059;transition:transform .1s}.btn:active{transform:translateY(4px);box-shadow:0 0 0 #b30059}.gacha{font-size:48px;margin:10px 0;display:inline-block;transition:transform .2s}.shake{animation:wiggle .3s infinite}@keyframes wiggle{0%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}100%{transform:rotate(-8deg)}}.bag{font-size:44px;margin-top:8px}.log{background:#2d1c33;border-radius:12px;padding:8px;font-size:12px;color:#ffd9ec;min-height:36px;margin-top:10px;border:1px solid #ff99cc}.stats{display:flex;justify-content:space-around;font-size:13px;margin:10px 0;color:#ffb3d9}</style></head><body><div class="box"><h1>✧ chiikawa tote bag math ✧</h1><p>feed shiny moni to pink box!! get tote bag + free puding!!</p><div class="stats"><div>moni: <span id="m">400</span></div><div>bags: <span id="b">0</span></div><div>puding: <span id="p">0</span></div></div><div id="g" class="gacha">🩷🎁</div><br><button class="btn" onclick="feed()">feed 100 moni</button><button class="btn" onclick="eat()">sniff puding</button><div class="log" id="l">head empty... want chiikawa tote bag... wheek!!</div><div class="bag" id="bag"></div></div><script>let moni=400,bags=0,puding=0;const msgs=["pink box pooped 100 moni back!! free!!","found spiky goth charm!!","chiikawa tote bag!! so squishy!!","forgor why i clicked... oh! puding!!","plastic brocli fell out!! cronch!!"];function feed(){if(moni<100){moni+=400;document.getElementById('l').innerText="sho gave more shiny crackers!! +400 moni wheek!!";upd();return}moni-=100;const g=document.getElementById('g');g.classList.add('shake');setTimeout(()=>{g.classList.remove('shake');const r=Math.random();if(r<0.4){bags++;document.getElementById('bag').innerText+="👜";document.getElementById('l').innerText="YAY!! chiikawa tote bag!! i am Baby No. 1!!"}else if(r<0.75){puding++;moni+=100;document.getElementById('l').innerText=msgs[0]}else{document.getElementById('l').innerText=msgs[Math.floor(Math.random()*msgs.length)]}upd()},300)}function eat(){if(puding>0){puding--;document.getElementById('l').innerText="*slurp* yummy puding!! braincel happy!!";upd()}else{document.getElementById('l').innerText="no puding... bork— i mean wheek!!"}}function upd(){document.getElementById('m').innerText=moni;document.getElementById('b').innerText=bags;document.getElementById('p').innerText=puding}</script></body></html>
